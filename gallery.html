    <h1>Gallery</h1>

    <div class="gallery-filters" id="galleryPublicFilters" aria-label="Filter by album"></div>

      Loading photos...
    </div>

  </section>

<div
    class="gallery-lightbox"
    id="galleryLightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Photo viewer"
    aria-hidden="true">

    <button
        type="button"
        class="gallery-lightbox-close"
        id="galleryLightboxClose"
        aria-label="Close photo viewer">

        ✕

    </button>

    <button
        type="button"
        class="gallery-lightbox-nav gallery-lightbox-prev"
        id="galleryLightboxPrev"
        aria-label="Previous photo">

        ‹

    </button>

    <figure class="gallery-lightbox-figure">
        <img id="galleryLightboxImage" src="" alt="">
        <figcaption id="galleryLightboxCaption"></figcaption>
    </figure>

    <button
        type="button"
        class="gallery-lightbox-nav gallery-lightbox-next"
        id="galleryLightboxNext"
        aria-label="Next photo">

        ›

    </button>

</div>
